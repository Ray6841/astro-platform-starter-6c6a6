version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wms?schema=public
      - JWT_SECRET=${JWT_SECRET:-change_me}
      - PORT=4000
      - NODE_ENV=production
    depends_on:
      - db
    ports:
      - '4000:4000'
  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    ports:
      - '5173:80'
    volumes:
      - ./frontend:/app
volumes:
  db_data: